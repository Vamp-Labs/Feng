[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "contracts/test"
script = "script"
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[profile.deep.fuzz]
runs = 1000

[profile.deep.invariant]
runs = 2000
depth = 64
fail_on_revert = true

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
robinhood-testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
arbitrum-sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[lint]
lint_on_build = false

[etherscan]
