name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundry:
    name: foundry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Ensure Solidity libraries are present
        run: |
          if [[ ! -d lib/forge-std/src || ! -d lib/openzeppelin-contracts/contracts ]]; then
            forge install --no-git foundry-rs/forge-std@v1.16.2 OpenZeppelin/openzeppelin-contracts@v5.7.0
          fi

      - name: Cache Foundry build
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml', 'remappings.txt', 'contracts/**/*.sol', 'script/**/*.sol') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_PRIVY_APP_ID: cm00000000000000000000000
      NEXT_PUBLIC_NETWORK: robinhood-testnet
      NEXT_PUBLIC_CHAIN_ID: "46630"
      NEXT_PUBLIC_RPC_URL: https://rpc.testnet.chain.robinhood.com
      NEXT_PUBLIC_EXPLORER_URL: https://explorer.testnet.chain.robinhood.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build
